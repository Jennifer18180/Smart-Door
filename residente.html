<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Residente | Panel de Control</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg-dark: #121212; 
            --card-bg: rgba(30, 30, 30, 0.85);
            --green-neon: #2ee97d;
            --green-dark: #059669;
            --gradient-green: linear-gradient(135deg, #2ee97d 0%, #059669 100%);
            --danger: #ef4444;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
        }

        body { 
            background: var(--bg-dark); 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            overflow: hidden; 
            height: 100vh; 
        }

        /* --- ESTILOS DE LOGIN --- */
        #login-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark); z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .login-box {
            background: #1e1e1e;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(46, 233, 125, 0.2);
            width: 85%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .brand {
            font-weight: 800; font-size: 1.8rem;
            background: var(--gradient-green);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 5px 0;
        }

        .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 30px; }

        .input-field {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 14px 15px;
            border-radius: 10px;
            font-size: 1rem;
            margin-bottom: 15px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-field:focus { border-color: var(--green-neon); }

        .btn-primary {
            width: 100%;
            background: var(--gradient-green); color: #000;
            border: none; padding: 14px; border-radius: 10px;
            font-weight: 800; font-size: 1rem; cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 233, 125, 0.3);
            transition: transform 0.2s;
        }
        
        .btn-primary:active { transform: scale(0.98); }

        .error-msg { color: var(--danger); font-size: 0.85rem; margin-top: 10px; display: none; }

        /* --- ESTILOS DEL DASHBOARD PRINCIPAL --- */
        #main-dashboard { display: none; width: 100%; height: 100%; }

        /* --- ESTILOS DEL MONITOR DE VIDEO --- */
        #video-wrapper {
            position: absolute; 
            top: 55%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            width: 90%; 
            max-width: 800px; 
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 24px;
            border: 2px solid rgba(46, 233, 125, 0.4);
            box-shadow: 0 10px 40px rgba(46, 233, 125, 0.15);
            overflow: hidden;
            z-index: 5;
            display: none;
        }

        #remoteVideo { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
        
        #top-bar {
            position: absolute; top: 0; left: 0; width: 100%;
            z-index: 10; padding: 25px 30px; box-sizing: border-box;
            background: linear-gradient(to bottom, rgba(18,18,18,0.9), transparent);
            display: flex; justify-content: space-between; align-items: flex-start;
        }

        .apto-label { color: var(--text-muted); font-size: 0.9rem; font-weight: 600; margin-top: 5px; }

        #status-badge {
            background: var(--card-bg); backdrop-filter: blur(10px);
            padding: 10px 20px; border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: 600; font-size: 0.9rem;
            display: flex; align-items: center; gap: 8px;
        }

        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #555; }
        .status-dot.active { background: var(--danger); box-shadow: 0 0 10px var(--danger); animation: pulse-red 1s infinite; }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* Tarjeta de información del visitante */
        #visitor-info {
            position: absolute; top: 90px; left: 30px;
            background: rgba(18, 18, 18, 0.85); backdrop-filter: blur(10px);
            border-left: 4px solid var(--green-neon);
            padding: 15px 20px; border-radius: 0 10px 10px 0;
            z-index: 10; display: none;
        }
        
        #visitor-info h3 { margin: 0 0 5px 0; font-size: 1.2rem; }
        #visitor-info p { margin: 0; color: var(--text-muted); font-size: 0.9rem; }

        .controls { 
            position: fixed; bottom: 40px; width: 100%; 
            display: flex; justify-content: center; gap: 20px; z-index: 20; 
        }

        .btn { 
            padding: 18px 40px; border-radius: 50px; font-weight: 600; 
            border: none; cursor: pointer; font-size: 1.1rem;
            display: flex; align-items: center; gap: 10px;
        }

        .btn-abrir { background: var(--gradient-green); color: #000; box-shadow: 0 4px 15px rgba(46, 233, 125, 0.3); }
        .btn-colgar { background: var(--card-bg); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }

        #standby-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark); z-index: 5;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        
        .standby-icon {
            width: 80px; height: 80px; border-radius: 50%;
            background: rgba(46, 233, 125, 0.1); border: 1px solid rgba(46, 233, 125, 0.3);
            display: flex; align-items: center; justify-content: center; margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE LOGIN -->
    <div id="login-screen">
        <div class="login-box">
            <h2 class="brand">Scalable Access</h2>
            <p class="subtitle">Acceso seguro para residentes</p>
            
            <input type="email" id="email" class="input-field" placeholder="Correo electrónico">
            <input type="password" id="password" class="input-field" placeholder="Contraseña">
            
            <button class="btn-primary" onclick="iniciarSesion()">Ingresar al Panel</button>
            <p id="error-msg" class="error-msg">Credenciales incorrectas.</p>
        </div>
    </div>

    <!-- DASHBOARD DEL RESIDENTE (Oculto hasta hacer login) -->
    <div id="main-dashboard">
        <div id="top-bar">
            <div>
                <h2 class="brand" style="font-size: 1.2rem;">Scalable Access</h2>
                <div class="apto-label">Panel Residente • Apto <span id="mi-apto">101</span></div>
            </div>
            <div id="status-badge">
                <div class="status-dot" id="dot"></div>
                <span id="status-text">Standby</span>
            </div>
        </div>

        <div id="visitor-info">
            <h3 id="v-name">Nombre Visitante</h3>
            <p id="v-reason">Motivo</p>
        </div>

        <div id="standby-screen">
            <div class="standby-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--green-neon)" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            </div>
            <h3 style="color: var(--text-muted); font-weight: 400;">Monitoreando entrada...</h3>
        </div>

        <!-- Monitor de Video Central -->
        <div id="video-wrapper">
            <video id="remoteVideo" autoplay playsinline></video>
        </div>

        <div class="controls" id="controles" style="display: none;">
            <button class="btn btn-colgar" onclick="colgar()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"></path><line x1="23" y1="1" x2="1" y2="23"></line></svg>
                Rechazar
            </button>
            <button class="btn btn-abrir" onclick="abrirPuerta()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg>
                Autorizar
            </button>
        </div>
    </div>

    <script>
        // Tus credenciales de Supabase
        const SUPABASE_URL = 'https://ugmghwxsdxrghlyumbqr.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVnbWdod3hzZHhyZ2hseXVtYnFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2NTc4MjUsImV4cCI6MjA5MTIzMzgyNX0.Te7Tp655sZnoSz8HhLOEjjPcjx06BnCdqmosW-TxQBY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const MI_APTO = '101'; // Idealmente, esto se jalaría de la base de datos tras el login
        document.getElementById('mi-apto').innerText = MI_APTO;
        
        let peer;
        let currentCall;

        // --- SISTEMA DE AUTENTICACIÓN ---
        
        // Verifica si ya hay una sesión activa al cargar la página
        async function checkSession() {
            const { data, error } = await supabaseClient.auth.getSession();
            if (data.session) {
                mostrarDashboard();
            }
        }

        async function iniciarSesion() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
                
            errorMsg.style.display = 'none';
                
            // --- PUERTA TRASERA DE DESARROLLO (BYPASS) ---
            if (email === 'admin@gmail.com' && password === '1234') {
                console.log("¡Modo socio activado! Saltando validación de Supabase...");
                mostrarDashboard();
                return; // Detenemos la función aquí para que no busque en la base de datos
            }
            // ----------------------------------------------
        
            // Validación real con Supabase (La dejamos aquí para cuando recuperes el acceso)
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });
        
            if (error) {
                errorMsg.style.display = 'block';
                errorMsg.innerText = "Error: Credenciales incorrectas.";
            } else {
                mostrarDashboard();
            }
        }

        function mostrarDashboard() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-dashboard').style.display = 'block';
            initResidente();
            escucharTimbre();
        }

        // --- SISTEMA DE VIDEO Y CONEXIÓN ---

        function initResidente() {
            peer = new Peer({
                config: { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }] }
            });
            peer.on('open', (id) => console.log('Residente listo.'));
        }

        function escucharTimbre() {
            supabaseClient
                .channel('room1')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'visitor_messages' }, payload => {
                    const data = payload.new;
                    
                    if (data.apto === MI_APTO && data.message.includes('[SISTEMA] PeerID:')) {
                        // DESEMPAQUETANDO LA DATA: [SISTEMA] PeerID:xxx|NOMBRE:yyy|MOTIVO:zzz
                        const parts = data.message.split('|');
                        const visitorPeerId = parts[0].split(':')[1];
                        const visitorName = parts[1] ? parts[1].split(':')[1] : "Desconocido";
                        const visitorReason = parts[2] ? parts[2].split(':')[1] : "No especificado";
                        
                        // Actualizar la interfaz con los datos
                        document.getElementById('v-name').innerText = visitorName;
                        document.getElementById('v-reason').innerText = visitorReason;
                        document.getElementById('visitor-info').style.display = 'block';

                        document.getElementById('status-text').innerText = "¡Alguien en la puerta!";
                        document.getElementById('status-text').style.color = "var(--danger)";
                        document.getElementById('dot').classList.add('active');
                        document.getElementById('standby-screen').style.display = 'none';
                        
                        conectarVideo(visitorPeerId);
                    }
                })
                .subscribe();
        }

        function conectarVideo(visitorPeerId) {
            navigator.mediaDevices.getUserMedia({ audio: true, video: false })
            .then((stream) => {
                currentCall = peer.call(visitorPeerId, stream);
                
                currentCall.on('stream', (remoteStream) => {
                    const remoteVideo = document.getElementById('remoteVideo');
                    remoteVideo.srcObject = remoteStream;
                    
                    document.getElementById('controles').style.display = "flex";
                    document.getElementById('video-wrapper').style.display = 'block';
                });
            })
            .catch(err => alert("Error de micrófono: " + err));
        }

        function colgar() {
            if (currentCall) currentCall.close();
            resetDashboard();
        }

        function abrirPuerta() {
            alert("¡Puerta abierta! Registrado en bitácora.");
            colgar(); 
        }

        function resetDashboard() {
            document.getElementById('video-wrapper').style.display = 'none';
            document.getElementById('remoteVideo').srcObject = null;
            document.getElementById('status-text').innerText = "Standby";
            document.getElementById('status-text').style.color = "var(--text-main)";
            document.getElementById('dot').classList.remove('active');
            document.getElementById('controles').style.display = "none";
            document.getElementById('visitor-info').style.display = "none";
            document.getElementById('standby-screen').style.display = "flex";
        }

        // Ejecutar al iniciar
        checkSession();
    </script>
</body>
</html>
